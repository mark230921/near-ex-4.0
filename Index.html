<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Near Ex 3.0</title>
    <style>
        body {
            font-family: Roboto, RobotoDraft, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 640px;
        }

        .form-card, .thank-you-card {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .header-card {
            border-top: 10px solid #FF6600; /* 7-Eleven Orange */
            position: relative;
        }

        .header-card::after {
            content: "";
            display: block;
            height: 4px;
            background: linear-gradient(90deg, #008000 33%, #FF6600 33%, #FF6600 66%, #DA291C 66%);
            margin-top: 16px;
            border-radius: 2px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            color: #008000; /* 7-Eleven Green */
            margin: 0;
        }

        .question-title {
            font-size: 14px;
            font-weight: 500;
            color: #202124;
            display: block;
            margin-bottom: 12px;
        }

        input[type="text"], input[type="date"], select {
            width: 50%;
            border: none;
            border-bottom: 1px solid #70757a;
            padding: 4px 0;
            font-size: 14px;
            color: #202124;
            background: transparent;
            outline: none;
            transition: border-bottom 0.2s;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-bottom: 2px solid #FF6600;
            padding-bottom: 3px;
        }

        input::placeholder {
            color: #70757a;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .submit-btn, .reset-btn {
            background-color: #008000;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
.           font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn {
            background-color: #008000;
        }

        .submit-btn:hover, .reset-btn:hover {
            background-color: #006600;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #DA291C; /* 7-Eleven Red */
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        .thank-you-card {
            display: none;
            border-top: 10px solid #008000;
        }

        .thank-you-card h2 {
            font-size: 24px;
            font-weight: 500;
            color: #008000;
            margin-top: 0;
        }

        .thank-you-card p {
            font-size: 14px;
            color: #202124;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- Hidden Iframe to handle Google Forms backend submission smoothly without page redirect -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted) { showThankYou(); }"></iframe>

        <!-- 
          INSTRUCTIONS TO CONNECT GOOGLE FORM:
          1. Replace the 'action' URL below with your actual Google Form URL (change '/viewform' to '/formResponse').
          2. Replace the 'name="entry.XXXXXX"' attributes with the actual entry keys from your Google Form inputs.
        -->
        <div id="formContainer">
            <form id="myForm" 
                  action="" 
                  method="POST" 
                  target="hidden_iframe" 
                  onsubmit="submitted();">
                
                <!-- Title Header Card -->
                <div class="form-card header-card">
                    <center>
                    <h1>Near Ex Project 3.0</h1>
                        </center>
                </div>

                <!-- STORE NAME -->
                <div class="form-card">
                    <label class="question-title" for="store_name">STORE NAME</label>
                    <input type="text" id="store_name" name="entry.111111111" placeholder="Your answer" required>
                </div>

                <!-- STORE DISTRICT - AREA -->
                <div class="form-card">
                    <label class="question-title" for="store_district">STORE DISTRICT - AREA</label>
                    <input type="text" id="store_district" name="entry.222222222" placeholder="Your answer" required>
                </div>

                <!-- STORE MANAGER -->
                <div class="form-card">
                    <label class="question-title" for="store_manager">STORE MANAGER</label>
                    <input type="text" id="store_manager" name="entry.333333333" placeholder="Your answer" required>
                </div>

                <!-- STORE CLUSTER -->
                <div class="form-card">
                    <label class="question-title" for="store_cluster">STORE CLUSTER</label>
                    <input type="text" id="store_cluster" name="entry.444444444" placeholder="Your answer" required>
                </div>

                <!-- ITEM CATEGORY (Dropdown) -->
                <div class="form-card">
                    <label class="question-title" for="item_category">ITEM CATEGORY</label>
                    <select id="item_category" name="entry.555555555" required>
                        <option value="" disabled selected>Choose</option>
                        <option value="HABA">1. HABA</option>
                        <option value="GROCERY">2. GROCERY</option>
                        <option value="CONFECT">3. CONFECT</option>
                        <option value="NON FOOD">4. NON FOOD</option>
                        <option value="JUICES AND TEAS">5. JUICES AND TEAS</option>
                        <option value="NOODLES">6. NOODLES</option>
                        <option value="BISCUITS">7. BISCUITS</option>
                        <option value="DAIRIES AND YOGURT">8. DAIRIES AND YOGURT</option>
                        <option value="BOTTLED WATER AND ENERGY DRINKS">9. BOTTLED WATER AND ENERGY DRINKS</option>
                    </select>
                </div>

                <!-- ITEM SKU -->
                <div class="form-card">
                    <label class="question-title" for="item_sku">ITEM SKU</label>
                    <input type="text" id="item_sku" name="entry.666666666" placeholder="Your answer" required>
                </div>

                <!-- EXPIRATION DATE -->
                <div class="form-card">
                    <label class="question-title" for="expiration_date">EXPIRATION DATE</label>
                    <input type="date" id="expiration_date" name="entry.777777777" required>
                </div>

                <!-- SUGGESTED PROMO (Dropdown) -->
                <div class="form-card">
                    <label class="question-title" for="suggested_promo">SUGGESTED PROMO</label>
                    <select id="suggested_promo" name="entry.888888888" required>
                        <option value="" disabled selected>Choose</option>
                        <option value="BUY 1 TAKE 1">1. BUY 1 TAKE 1</option>
                        <option value="50% OFF">2. 50% OFF</option>
                        <option value="30% OFF">3. 30% OFF</option>
                        <option value="BUY 2 SAVE ****">4. BUY 2 SAVE ****</option>
                    </select>
                </div>

                <!-- Submit and Clear Buttons Bar -->
                <div class="form-footer" style="justify-content:center;">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

            </form>
        </div>

        <!-- Thank You Message Container -->
        <div class="thank-you-card" id="thankYouMessage">
            <h2>New Project</h2>
            <p>Your response has been recorded.</p>
            <button class="reset-btn" onclick="submitAnother()">Submit another response</button>
        </div>

    </div>

    <script>
        let isSubmitted = false;

        function submitted() {
            // Flag that the user has triggered a submission
            isSubmitted = true;
        }

        function showThankYou() {
            // Hides form and displays the thank you panel when data is posted to Google successfully
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('thankYouMessage').style.display = 'block';
        }

        function clearForm() {
            document.getElementById('myForm').reset();
        }

        function submitAnother() {
            // Reset state variables and clear the form fields
            isSubmitted = false;
            document.getElementById('myForm').reset();

            // Switch views back to form
            document.getElementById('thankYouMessage').style.display = 'none';
            document.getElementById('formContainer').style.display = 'block';
        }
    </script>

</body>
</html>
